name: Deploy Dev Admin

on:
  push:
    branches:
      - dev
    paths:
      - 'apps/admin/**'
      - 'apps/api/**'

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deploy for Admin
        run: |
          curl --request GET \
            --url "https://coolify-vps.inova.ma.gov.br/api/v1/deploy?uuid=gk3pvl4vkfo2zel44bmwz766&force=false" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}"
